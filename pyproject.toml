[project]
name = "first_crew"
version = "1.0.0"
description = "CrewAI multi-agent system for Yelp review prediction (AgentSociety Challenge Track 1)"
authors = [{ name = "Atsbaha Teweldemedhn", email = "atsbaha.teweldemedhn@mu.edu.et" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "cohere>=5.20.7",
    "crewai[google-genai,tools]==1.9.3",
    "fastapi>=0.136.0",
    "google-generativeai>=0.8.6",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "litellm>=1.75.3",
    "python-docx>=1.2.0",
    "sentence-transformers>=5.3.0",
]

[project.scripts]
first_crew = "first_crew.main:run"
run_crew = "first_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
